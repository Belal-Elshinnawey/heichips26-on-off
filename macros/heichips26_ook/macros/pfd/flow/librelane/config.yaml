meta:
  version: 3
  flow: Classic
  substituting_steps:

    # Magic reports some overlaps which can be ignored
    Checker.IllegalOverlap: null

    # Intentional combinational loop: the PFD's reset is generated by
    # NANDing both flip-flops' outputs and feeding it back into their own
    # async resets, so it self-resets with minimal dead zone. Real gate
    # delay makes this settle correctly in silicon; Yosys's structural
    # check assumes zero-delay logic and can't tell that apart from an
    # unstable loop, so it always flags it.
    Checker.YosysSynthChecks: null

DESIGN_NAME: pfd
VERILOG_FILES: dir::../../rtl/*.sv

# Clock
# clk_ref is the raw 80MHz reference input (undivided). clk_fb is the raw
# feedback/VCO input, nominally 433.92MHz -- it is a second, asynchronous
# clock and is constrained separately in impl.sdc/signoff.sdc since
# LibreLane's CLOCK_PORT/CLOCK_PERIOD only cover one primary clock.
CLOCK_PORT: clk_ref
CLOCK_NET: clk_ref
CLOCK_PERIOD: 12.5

# Layout / Floorplan Rules
# Bumped up from the standalone pfd_digital's 35x30: this macro now also
# holds ref_clk_gen's 7-bit counter and fb_clk_gen's toggle-flop + 9-bit
# counter. Unverified -- re-check after the first librelane run and shrink
# or grow DIE_AREA to match actual placed-cell utilization.
FP_SIZING: absolute
DIE_AREA: [0, 0, 100, 60]
PL_TARGET_DENSITY_PCT: 60
GRT_ALLOW_CONGESTION: true

# Set the margin
TOP_MARGIN_MULT: 1
BOTTOM_MARGIN_MULT: 1
LEFT_MARGIN_MULT: 8
RIGHT_MARGIN_MULT: 8

# Valid values are AREA 0-3 and DELAY 0-4
# DELAY 4 = fastest, but largest area
# AREA 3 = slowest, but smallest area
SYNTH_STRATEGY: DELAY 4

# Use Metal2/Metal3 straps
PDN_VERTICAL_LAYER: Metal2
PDN_HORIZONTAL_LAYER: Metal3
RT_MAX_LAYER: Metal4

# Pin placement: ref clock west, fb clock east, pfd up/dn north, reset south
FP_PIN_ORDER_CFG: dir::pin_order.cfg

# SDC files
PNR_SDC_FILE: dir::impl.sdc
SIGNOFF_SDC_FILE: dir::signoff.sdc

# Enable plugin for better SystemVerilog support
# USE_SLANG: True
