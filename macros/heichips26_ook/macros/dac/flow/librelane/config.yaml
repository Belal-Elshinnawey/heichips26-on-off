meta:
  version: 3
  flow: Classic
  substituting_steps:

    # Magic reports some overlaps which can be ignored
    Checker.IllegalOverlap: null

DESIGN_NAME: dac
VERILOG_FILES: dir::../../rtl/*.sv

# Clock
# clk_ref is the raw 80MHz reference input (undivided) and is the only
# primary clock LibreLane's CLOCK_PORT/CLOCK_PERIOD tracks. clk_fb is a
# second, asynchronous clock (the raw VCO feedback, nominally 433.92MHz)
# and is constrained separately in impl.sdc/signoff.sdc.
CLOCK_PORT: clk_ref
CLOCK_NET: clk_ref
CLOCK_PERIOD: 12.5

# Layout / Floorplan Rules
# Rough starting guess -- this macro is an 8-bit period counter, a 10-bit
# duty register, a 10-bit delta-sigma accumulator, plus the FB_DIV=128
# clk_fb divider (a 7-stage single-bit toggle-FF ripple chain, not a wide
# counter). Re-check after the first LibreLane run and shrink or grow
# DIE_AREA to match actual placed-cell utilization.
FP_SIZING: absolute
DIE_AREA: [0, 0, 190, 80]
PL_TARGET_DENSITY_PCT: 80
GRT_ALLOW_CONGESTION: true

# Set the margin
TOP_MARGIN_MULT: 1
BOTTOM_MARGIN_MULT: 1
LEFT_MARGIN_MULT: 8
RIGHT_MARGIN_MULT: 8

# Valid values are AREA 0-3 and DELAY 0-4
# DELAY 4 = fastest, but largest area
# AREA 3 = slowest, but smallest area
SYNTH_STRATEGY: AREA 1

# Use Metal2/Metal3 straps
PDN_VERTICAL_LAYER: Metal2
PDN_HORIZONTAL_LAYER: Metal3
RT_MAX_LAYER: Metal4

# Pin placement: ref clock west, fb clock east, dac_out north, reset south
FP_PIN_ORDER_CFG: dir::pin_order.cfg

# SDC files
PNR_SDC_FILE: dir::impl.sdc
SIGNOFF_SDC_FILE: dir::signoff.sdc

# Enable plugin for better SystemVerilog support
# USE_SLANG: True
